<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MySQL Demo</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
    }
    h1 { margin: 0 0 8px; font-size: 1.75rem; }
    p { margin: 0 0 24px; color: #94a3b8; line-height: 1.5; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    pre {
      margin: 20px 0 0;
      padding: 16px;
      min-height: 52px;
      background: #0f172a;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.9rem;
    }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <main>
    <h1>MySQL Demo</h1>
    <p>Sayt Netlify'da ishlayapti. Quyidagi tugma orqali <code>/api</code> funksiyasini tekshiring.</p>
    <button id="check">API'ni tekshirish</button>
    <pre id="result">Natija shu yerda chiqadi…</pre>
  </main>

  <script>
    const btn = document.getElementById("check");
    const out = document.getElementById("result");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      out.className = "";
      out.textContent = "Yuklanmoqda…";
      try {
        const res = await fetch("/api");
        const text = await res.text();
        let body = text;
        try { body = JSON.stringify(JSON.parse(text), null, 2); } catch {}
        out.className = res.ok ? "ok" : "err";
        out.textContent = `HTTP ${res.status}\n${body}`;
      } catch (e) {
        out.className = "err";
        out.textContent = "Xatolik: " + e.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
